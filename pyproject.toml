[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "ares-rover"
version = "1.0.0"
description = "Energy-aware autonomous rover planning and simulation benchmark"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Haarika Alla"}]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.8", "mypy>=1.13"]

[project.scripts]
ares-rover = "rover.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/rover"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
